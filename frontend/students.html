<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Student MS</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html" class="active">Students</a>
            <a href="add-student.html">Add Student</a>
            <a href="#">Attendance</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Students</h1>
                <p>Manage student records</p>
            </div>

            <a href="add-student.html" class="add-button">
                + Add Student
            </a>

        </header>


        <!-- Search and Filter -->

        <section class="student-controls">

            <input
                type="text"
                id="searchStudent"
                placeholder="Search student by name or roll number..."
            >

            <select id="departmentFilter">

                <option value="">All Departments</option>
                <option value="ECE">ECE</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>

            </select>

        </section>


        <!-- Student Table -->

        <section class="students-section">

            <table id="studentTable">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>01</td>
                        <td>Rahul</td>
                        <td>23A01</td>
                        <td>ECE</td>
                        <td>3rd</td>
                        <td>rahul@gmail.com</td>

                        <td>
                            <button class="view-btn">View</button>
                            <button class="edit-btn">Edit</button>
                        </td>
                    </tr>


                    <tr>
                        <td>02</td>
                        <td>Priya</td>
                        <td>23A02</td>
                        <td>CSE</td>
                        <td>3rd</td>
                        <td>priya@gmail.com</td>

                        <td>
                            <button class="view-btn">View</button>
                            <button class="edit-btn">Edit</button>
                        </td>
                    </tr>


                    <tr>
                        <td>03</td>
                        <td>Arjun</td>
                        <td>23A03</td>
                        <td>EEE</td>
                        <td>2nd</td>
                        <td>arjun@gmail.com</td>

                        <td>
                            <button class="view-btn">View</button>
                            <button class="edit-btn">Edit</button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>


<script src="js/script.js"></script>

</body>

</html>
